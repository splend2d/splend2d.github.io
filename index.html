---
layout: null
---
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  html,body{margin:0;background:#ece8e0;overflow:hidden}
  .room{position:relative;height:100vh;height:100svh;overflow:hidden;background:#d6cfc1}
  .room img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block}
  /* 세로 화면(휴대폰): 책장이 잘리지 않게 전체를 보여주고 아래쪽에 붙임 */
  @media (max-aspect-ratio: 1/1){
    .room img{top:auto;bottom:0;height:auto;-webkit-mask-image:linear-gradient(transparent,#000 12%);mask-image:linear-gradient(transparent,#000 12%)}
  }
  section{max-width:720px;margin:0 auto;padding:56px 20px 80px;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:#3a2e25}
  ul{list-style:none;padding:0;margin:0}
  li{display:flex;justify-content:space-between;gap:16px;padding:12px 2px;border-bottom:1px dashed #d9cfc1}
  li a{color:inherit;text-decoration:none}
  li a:hover{color:#9a5a2e}
  li time{color:#8a7a6a;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div class="room">
  <picture>
    <source media="(max-aspect-ratio: 1/1)" srcset="{{ '/home.png' | relative_url }}">
    <img src="{{ '/home-wide.png' | relative_url }}" alt="원목 책장과 마룻바닥" width="1971" height="1374">
  </picture>
</div>

</body>
</html>
