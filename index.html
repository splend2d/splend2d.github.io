---
layout: null
---
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  html,body{margin:0;background:#e0d9cc;overflow:hidden}
  .room{height:100vh;height:100svh}
  .room svg{display:block;width:100%;height:100%;overflow:visible}
  .room{overflow:hidden}
  .item{cursor:pointer}
  .item image{transition:transform .35s ease;transform-box:fill-box;transform-origin:50% 100%}
  .item:hover image,.item:focus image{transform:rotate(-1.2deg) scale(1.01)}
  .item:focus{outline:none}
</style>
</head>
<body>
<div class="room">
  <svg id="room" viewBox="0 0 1971 1374" preserveAspectRatio="xMidYMid slice" role="img" aria-label="원목 책장과 마룻바닥">
    <defs><linearGradient id="fadeTop" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e0d9cc"/><stop offset="1" stop-color="#e0d9cc" stop-opacity="0"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter></defs>
    <rect x="-3000" y="-3000" width="8000" height="3300" fill="#e0d9cc"/>
    <image href="{{ '/home-wide.png' | relative_url }}" width="1971" height="1374"/>
    <rect id="fade" x="0" y="259" width="1971" height="55" fill="url(#fadeTop)" display="none"/>

    <!-- 물주기 (방명록) -->
    <a class="item" href="{{ '/water/' | relative_url }}" aria-label="물주기">
      <title>물주기</title>
      <ellipse cx="255" cy="1168" rx="100" ry="14" fill="#2a1a0e" opacity=".38" filter="url(#blur)"/>
      <image href="{{ '/plant.png' | relative_url }}" x="100" y="408" width="312" height="760"/>
    </a>
  </svg>
</div>
<script>
  // 세로 화면(휴대폰)에서는 책장과 화분이 잘리지 않게 보이는 범위를 조정
  const svg = document.getElementById('room');
  function fit(){
    const portrait = innerWidth / innerHeight < 1;
    svg.setAttribute('viewBox', portrait ? '60 260 1620 960' : '0 0 1971 1374');
    svg.setAttribute('preserveAspectRatio', portrait ? 'xMidYMax meet' : 'xMidYMid slice');
    document.getElementById('fade').setAttribute('display', portrait ? 'inline' : 'none');
  }
  fit(); addEventListener('resize', fit);
</script>
</body>
</html>
